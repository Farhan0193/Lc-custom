<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LC Management</title>
<style>
:root{--navy:#16324f;--blue:#2463a6;--bg:#f3f6fa;--line:#d9e1ea;--text:#18212b;--muted:#64748b;--red:#b42318;--green:#137547;--teal:#087e8b;--amber:#b7791f;--purple:#6b4db3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;color:var(--text)}header{background:var(--navy);color:white;padding:16px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}header h1{font-size:20px;margin:0}header small{opacity:.85}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 70px)}.layout.menu-closed{grid-template-columns:1fr}.layout.menu-closed nav{display:none}nav{background:#fff;border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:5px}nav button{border:0;background:transparent;text-align:left;padding:10px;border-radius:8px;color:#27384a;cursor:pointer;font-size:14px}nav button.active,nav button:hover{background:#e8f0fa;color:var(--blue);font-weight:700}main{padding:18px;min-width:0}.panel{background:#fff;border:1px solid #d6e2ef;border-top:3px solid #8bb8e8;border-radius:12px;padding:16px;margin-bottom:15px;box-shadow:0 2px 8px #0b1b2a08}.panel h2{font-size:20px;margin:0 0 14px}.panel h3{font-size:16px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field label{font-size:13px;color:#475569}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:7px;padding:9px;font:inherit;background:white}.field textarea{min-height:70px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid #1d5594;border-radius:7px;padding:9px 13px;cursor:pointer;background:linear-gradient(180deg,#347ac0,#2463a6);color:white;font-weight:600;box-shadow:0 1px 2px #0b1b2a12}.btn.secondary{border:1px solid #c6d4e3;background:#f0f5fa;color:#24364b}.btn.danger{border:1px solid #a91f17;background:linear-gradient(180deg,#d94b42,#b42318)}.btn.green{border:1px solid #0d623a;background:linear-gradient(180deg,#20965c,#137547)}.btn.secondary{background:#e8eef5;color:#24364b}.btn.danger{background:var(--red)}.btn.green{background:var(--green)}.btn.small{padding:5px 8px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:22px;margin-top:5px;overflow-wrap:anywhere}.table-wrap{overflow:auto;width:100%}table{border-collapse:collapse;width:100%;font-size:13px;min-width:680px}th,td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}th{background:#e6f0fb;color:#183e63;white-space:nowrap}tbody tr:nth-child(even){background:#f8fbff}tbody tr:hover{background:#eef6ff}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.notice{background:#fff8e6;border:1px solid #f2d48b;padding:10px;border-radius:8px;margin-bottom:12px;font-size:13px}.hidden{display:none!important}.report-head{text-align:center;margin:8px 0 18px}.report-head h2{margin:3px}.report-head{border-bottom:2px solid #d6e7f8;padding-bottom:10px}.actions .btn:focus,.field input:focus,.field select:focus{outline:2px solid #9bc5f1;outline-offset:1px}.pill{display:inline-block;border-radius:20px;padding:3px 8px;background:#e9f7ef;color:var(--green);font-size:12px}.pill.neg{background:#fff0ef;color:var(--red)}footer{font-size:12px;color:var(--muted);padding:10px 0}.empty{text-align:center;padding:22px;color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:1fr}nav{border-right:0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}header h1{font-size:17px}}@media print{@page{size:A4;margin:12mm}html,body{background:#fff!important;font-size:11px;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}header,nav,.no-print,.notice,footer{display:none!important}.layout{display:block!important;background:#fff!important}.main-title-panel,.entry-panel,.filter-panel{display:none!important}main{padding:0!important}.panel{border:0!important;box-shadow:none!important;padding:0!important;margin:0 0 12px!important;background:#fff!important}.print-only{display:block!important}table{font-size:10px;min-width:0;border-collapse:collapse!important;width:100%!important}thead{display:table-header-group!important}tfoot{display:table-footer-group!important}tr{break-inside:avoid;page-break-inside:avoid}th,td{padding:6px;border:1px solid #9bb6d1!important}th{background:#dbeafe!important;color:#16324f!important;font-weight:700!important}tbody tr:nth-child(even){background:#f1f7ff!important}tbody tr:nth-child(odd){background:#fff!important}.report-head{margin-top:0;border-bottom:3px solid #2463a6!important;padding-bottom:10px!important;color:#16324f!important}.report-head h2{color:#16324f!important}.stat{border:1px solid #9bb6d1!important;background:#eef6ff!important}.pill{background:#e1f5e8!important;color:#137547!important}.btn{box-shadow:none!important}.grid{gap:8px}}

/* Refined colourful report and screen styling */
.statement-head{background:linear-gradient(120deg,#e8f4ff,#f4fbff);border:1px solid #b9d8f2;border-radius:10px;padding:16px!important;margin:0 0 12px!important}
.statement-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:12px 0;padding:10px;background:#f0f7ff;border:1px solid #c9def2;border-radius:9px;font-size:13px;line-height:1.9}
.summary-box{background:linear-gradient(135deg,#e4f8f2,#f4fffb);border:1px solid #a9dfcf;border-radius:9px;padding:8px 10px;color:#145b49}.summary-box small{display:block;color:#397767}.summary-box strong{display:block;font-size:16px}.summary-box.final{background:linear-gradient(135deg,#e4f7ed,#f5fff8);border-color:#8bd1a9;color:#12613a}
.statement-totals{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:14px;padding:12px;background:#edf5ff;border:1px solid #bdd5ee;border-radius:8px;color:#183e63}
.balance-sheet-head{text-align:center;padding:12px 8px 14px;margin-bottom:12px;border-bottom:3px solid #3277b8;color:#183e63;line-height:1.65}.balance-sheet-head h2{margin:0;font-size:22px;color:#163e65}.balance-sheet-head h3{margin:10px 0 2px;color:#244f78}.balance-sheet-head small{color:#60758b}
#main .panel:not(.no-print){border-top-color:#73aee3}
@media print{.statement-head{background:#e8f4ff!important;border:1px solid #8db8df!important}.statement-meta{background:#eff7ff!important;border:1px solid #9dbfe0!important;grid-template-columns:repeat(3,minmax(0,1fr))!important}.summary-box{background:#e4f8f2!important;border:1px solid #8bcdb8!important}.summary-box.final{background:#e4f7ed!important}.statement-totals{display:flex!important;visibility:visible!important;opacity:1!important;background:#edf5ff!important;border:1px solid #9dbfe0!important}.balance-sheet-head{border-bottom:3px solid #2463a6!important}.balance-sheet-head h2,.balance-sheet-head h3{color:#163e63!important}th{background:#1f5f91!important;color:#fff!important}tbody tr:nth-child(even){background:#eaf3fc!important}tbody tr:nth-child(odd){background:#fff!important}td{border-color:#b8cde0!important}.panel{background:#fff!important}}
@media(max-width:700px){.statement-meta{grid-template-columns:repeat(2,minmax(0,1fr))}}


/* v7 statement print layout */
.holder-bank small{display:block;color:#64748b;font-size:11px;margin-top:3px}
.balance-cell{font-weight:700;color:#145b49}
@media print{
 #printArea .summary-box.opening,#printArea .summary-box.final{display:none!important}
 @page{size:A4 landscape;margin:9mm}
 #printArea{width:100%!important;max-width:100%!important;overflow:visible!important;break-inside:auto!important;page-break-inside:auto!important}
 tfoot, tfoot tr, tfoot td {display: table-row-group!important; visibility: visible!important;}
}
</style>
</head>
<body>
